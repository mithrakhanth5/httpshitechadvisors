<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800">
  <!-- The panel's grain (Figma "noise" on the `bg` layer), as a transparent
       overlay above the art and under the copy. Figma's own filter
       (baseFrequency 2, two 10% colour layers) samples exactly on the noise
       lattice at 1x in Chrome and renders flat, so this rebuilds the effect
       as measured off design/latest.png: a 10% grey veil whose level varies
       per pixel, std 3.4 over the panel colour, with the render's slight
       neighbour anti-correlation (-0.12) from a light sharpen. Mean over
       #2E2926 -> (54, 50, 47), as in the render. -->
  <filter id="security-grain" x="0" y="0" width="1300" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.71" numOctaves="3" seed="2001" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0.2125 0.7154 0.0721 0 0  0.2125 0.7154 0.0721 0 0  0.2125 0.7154 0.0721 0 0  0 0 0 0 1"/>
    <feConvolveMatrix order="3" kernelMatrix="0 -0.08 0  -0.08 1.32 -0.08  0 -0.08 0" preserveAlpha="true"/>
    <feColorMatrix type="matrix" values="1.06 0 0 0 -0.0261  0 1.06 0 0 -0.0265  0 0 1.06 0 -0.0308  0 0 0 0 0.1"/>
  </filter>
  <rect width="1300" height="800" filter="url(#security-grain)"/>
</svg>
