<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <!-- Alpha mask for the radiating lines, in the `lines` piece's box
       (section 100, 20). The export's mask is `Ellipse 2084` (cx 639.185,
       cy 235.426, rx 364.295, ry 203.426); Figma renders it feathered —
       fitted against design/latest.png as a Gaussian of sigma 50. -->
  <filter id="soft" x="0" y="0" width="1100" height="480" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="50"/>
  </filter>
  <ellipse cx="539.185" cy="215.426" rx="364.295" ry="203.426" fill="#000" filter="url(#soft)"/>
</svg>
